<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Administrador - Forrajería Los Hermanos</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 38px 35px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            border-top: 5px solid #0ea5e9;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #0ea5e9;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
            background-color: white;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 22px;
            color: #1e293b;
            font-weight: 700;
        }

        .brand-header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #0ea5e9;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn-registrar {
            width: 100%;
            padding: 14px;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        .btn-registrar:hover {
            background-color: #0284c7;
        }

        .alerta-error {
            background-color: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #f87171;
        }

        .volver-box {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
            font-size: 14px;
            color: #64748b;
        }

        .volver-box a {
            color: #10b981;
            font-weight: 700;
            text-decoration: none;
            margin-left: 4px;
        }

        .volver-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-header">
            <img src="{{ url_for('static', filename='forrajeria_los_hermanos.jpeg') }}" alt="Logo"
                class="brand-logo-img">
            <h1>Registrar Administrador</h1>
            <p>Crear nueva cuenta de acceso al sistema</p>
        </div>

        {% if error %}
        <div class="alerta-error">{{ error }}</div>
        {% endif %}

        <form action="/registro" method="POST">
            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" name="username" required placeholder="Ingresa nombre de usuario"
                    autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Cree una contraseña">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                    placeholder="Repita la contraseña">
            </div>
            <button type="submit" class="btn-registrar">Registrar Cuenta</button>
        </form>

        <div class="volver-box">
            ¿Ya tenés cuenta? <a href="/login">Volver a Iniciar Sesión</a>
        </div>
    </div>
</body>

</html>
